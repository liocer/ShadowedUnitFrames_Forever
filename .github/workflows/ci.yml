name: CI

# Lint every push and pull request. Pushing a tag (e.g. v1.0.1) also builds the addon zip
# with the BigWigs packager and attaches it to a GitHub release for that tag.
on:
  push:
    branches: [ main ]
    tags: [ '**' ]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Luacheck
        run: |
          sudo apt-get install -y luarocks
          luarocks install --local luacheck
          ~/.luarocks/bin/luacheck . --no-color -q

  package:
    needs: luacheck
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
